name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, and what went wrong?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: false
  - type: input
    id: device
    attributes:
      label: Device / browser
      placeholder: e.g. iPhone 15 Safari, Chrome on Windows
    validations:
      required: false
  - type: textarea
    id: card
    attributes:
      label: Card JSON (if relevant)
      description: Paste the card code you were rendering, if any.
      render: json
    validations:
      required: false
